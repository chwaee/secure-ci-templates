name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Run this workflow from a vX.Y.Z tag."
              exit 1
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ vars.GO_VERSION || '1.27.3' }}
          cache: true

      - name: Build binaries
        run: |
          if [ ! -f go.mod ]; then
            echo "::error::go.mod is required."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            os="${pair%/*}"
            arch="${pair#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/app-${os}-${arch}" .
          done
          cd dist
          sha256sum app-* > SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
