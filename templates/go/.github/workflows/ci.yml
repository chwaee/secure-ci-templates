name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: ${{ vars.GO_VERSION || '1.27.3' }}
  TRIVY_FAIL_SEVERITY: ${{ vars.TRIVY_FAIL_SEVERITY || 'CRITICAL,HIGH' }}
  TRIVY_WARN_SEVERITY: ${{ vars.TRIVY_WARN_SEVERITY || 'MEDIUM' }}
  TRIVY_IGNORE_UNFIXED: ${{ vars.TRIVY_IGNORE_UNFIXED || 'false' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require a module
        run: |
          if [ ! -f go.mod ]; then
            echo "::error::go.mod is required."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Lint (golangci-lint run --fix fixes some findings)
        id: lint
        run: |
          if [ ! -f .golangci.yml ]; then
            echo "::notice::No .golangci.yml. Using the secure-ci-templates default."
            python3 -c 'from pathlib import Path; Path(".golangci.yml").write_text("version: \"2\"\nrun:\n  timeout: 5m\nlinters:\n  default: none\n  enable:\n    - errcheck\n    - gosec\n    - govet\n    - ineffassign\n    - staticcheck\n")'
          fi
          golangci-lint run --timeout=5m
          go vet ./...

      - name: Security lint (gosec high blocks, medium warns)
        id: security
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          gosec -severity high -confidence medium -quiet ./...

      - name: Gosec medium (warning)
        if: success()
        run: |
          set +e
          gosec -severity medium -confidence medium -fmt json -quiet -out "$RUNNER_TEMP/gosec.json" ./...
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error::gosec failed to run."
            exit "$code"
          fi
          GOSEC_JSON="$RUNNER_TEMP/gosec.json" python3 - <<'PY'
          import json
          import os
          data = json.load(open(os.environ["GOSEC_JSON"], encoding="utf-8"))
          issues = data.get("Issues") or []
          for item in issues:
              sev = (item.get("severity") or "").upper()
              if sev == "MEDIUM":
                  print(f"::warning::{item.get('rule_id')} {item.get('file')}:{item.get('line')} {item.get('details')}")
          PY

      - name: Test
        id: test
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '70' }}
        run: |
          echo "go test ./... must stay at or above ${COVERAGE_MIN}%."
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          if [ ! -s coverage.out ]; then
            echo "::error::go test did not write coverage.out. Add tests. Minimum is ${COVERAGE_MIN}%."
            exit 1
          fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { print $3 }')
          total=${total%%%}
          python3 - "$total" "$COVERAGE_MIN" <<'PY'
          import sys
          total = float(sys.argv[1])
          minimum = float(sys.argv[2])
          print(f"coverage {total:.1f}% (minimum {minimum:.0f}%)")
          if total + 1e-9 < minimum:
              print(f"::error::Coverage {total:.1f}% is below {minimum:.0f}%.")
              sys.exit(1)
          PY

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          skip-dirs: .git,vendor,.terraform,.venv,node_modules
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          version: v0.70.0

      - name: Enforce Trivy severity
        id: trivy
        env:
          TRIVY_REPORT: trivy-fs.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          fail = {s.strip().upper() for s in os.environ.get("TRIVY_FAIL_SEVERITY", "CRITICAL,HIGH").split(",") if s.strip()}
          warn = {s.strip().upper() for s in os.environ.get("TRIVY_WARN_SEVERITY", "MEDIUM").split(",") if s.strip()}
          path = os.environ.get("TRIVY_REPORT", "trivy.json")
          try:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except FileNotFoundError:
              print(f"::error::Trivy did not write {path}")
              sys.exit(1)
          except json.JSONDecodeError as exc:
              print(f"::error::Trivy report is not JSON: {exc}")
              sys.exit(1)

          if isinstance(report, dict):
              results = report.get("Results") or []
          elif isinstance(report, list):
              results = report
          else:
              results = []

          blocking = []
          warnings = []
          for result in results:
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities") or []:
                  sev = (vuln.get("Severity") or "").upper()
                  line = f"{sev} {vuln.get('VulnerabilityID', '')} {vuln.get('PkgName', '')} ({target})"
                  if sev in fail:
                      blocking.append(line)
                  elif sev in warn:
                      warnings.append(line)
              for secret in result.get("Secrets") or []:
                  title = secret.get("Title") or secret.get("RuleID") or "secret"
                  sev = (secret.get("Severity") or "HIGH").upper()
                  blocking.append(f"secret {sev} {title} ({target})")

          for line in warnings:
              print(f"::warning::{line}")
          for line in blocking:
              print(f"::error::{line}")
          if not blocking and not warnings:
              print("Trivy found nothing at medium or above. A clean scan on a project with no dependency manifest is a pass.")
          if blocking:
              sys.exit(1)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- secure-ci-templates:ci -->";
            const body = [
              marker,
              "## CI",
              "",
              "| Step | Result |",
              "| --- | --- |",
              `| Lint | ${process.env.LINT_OUTCOME} |`,
              `| Security | ${process.env.SECURITY_OUTCOME} |`,
              `| Test | ${process.env.TEST_OUTCOME} |`,
              `| Trivy | ${process.env.TRIVY_OUTCOME} |`,
              "",
              `[Run](${process.env.RUN_URL})`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: go
      build-mode: autobuild
