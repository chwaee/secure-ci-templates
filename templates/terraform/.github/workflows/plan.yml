name: Terraform plan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TF_WORKING_DIR: ${{ vars.TF_WORKING_DIR || '.' }}
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.17.1' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a role
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN before planning. This workflow uses OIDC."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Plan
        run: |
          cd "$TF_WORKING_DIR"
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > "$RUNNER_TEMP/plan.txt"

      - name: Comment with the plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_PATH: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- secure-ci-templates:plan -->";
            let body = fs.readFileSync(process.env.PLAN_PATH, "utf8");
            body = body.replace(/```/g, "'''");
            if (body.length > 60000) {
              body = body.slice(0, 60000) + "\n\n[truncated]";
            }
            const text = `${marker}\n## Terraform plan\n\n\`\`\`\n${body}\n\`\`\`\n`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: text,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: text,
              });
            }
