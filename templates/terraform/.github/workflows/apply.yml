name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type apply to run terraform apply
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TF_WORKING_DIR: ${{ vars.TF_WORKING_DIR || '.' }}
  TERRAFORM_VERSION: ${{ vars.TERRAFORM_VERSION || '1.17.1' }}

defaults:
  run:
    shell: bash

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the word apply
        if: inputs.confirm != 'apply'
        run: |
          echo "::error::Set confirm to apply. Nothing was applied."
          exit 1

  apply:
    needs: guard
    if: inputs.confirm == 'apply'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a role
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN before applying. This workflow uses OIDC."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Apply
        run: |
          cd "$TF_WORKING_DIR"
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
