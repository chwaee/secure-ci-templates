name: Deploy to Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  LAMBDA_DEPLOY_TOOL: ${{ vars.LAMBDA_DEPLOY_TOOL || 'sam' }}
  TF_WORKING_DIR: ${{ vars.TF_WORKING_DIR || '.' }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}

defaults:
  run:
    shell: bash

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require deploy settings
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN before deploying."
            exit 1
          fi
          if [ "$LAMBDA_DEPLOY_TOOL" = "sam" ]; then
            if [ ! -f template.yaml ] && [ ! -f template.yml ]; then
              echo "::error::SAM deploy needs template.yaml or template.yml."
              exit 1
            fi
            if [ ! -f samconfig.toml ] && [ ! -f samconfig.yaml ]; then
              echo "::error::SAM deploy needs samconfig.toml with staging and production environments."
              exit 1
            fi
          elif [ "$LAMBDA_DEPLOY_TOOL" = "terraform" ]; then
            if ! find "$TF_WORKING_DIR" -name '*.tf' -print -quit | grep -q .; then
              echo "::error::Terraform deploy needs .tf files in ${TF_WORKING_DIR}."
              exit 1
            fi
          else
            echo "::error::LAMBDA_DEPLOY_TOOL must be sam or terraform."
            exit 1
          fi

      - name: Set up Python
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up SAM
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: "1.170.0"
          use-installer: true

      - name: Set up Terraform
        if: env.LAMBDA_DEPLOY_TOOL == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy staging with SAM
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        run: |
          sam build
          sam deploy --config-env staging --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Deploy staging with Terraform
        if: env.LAMBDA_DEPLOY_TOOL == 'terraform'
        env:
          TF_ENVIRONMENT: ${{ vars.TF_VAR_environment }}
        run: |
          cd "$TF_WORKING_DIR"
          terraform init -input=false
          if [ -n "$TF_ENVIRONMENT" ]; then
            export TF_VAR_environment="$TF_ENVIRONMENT"
          fi
          terraform apply -input=false -auto-approve

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require deploy settings
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN before deploying."
            exit 1
          fi
          if [ "$LAMBDA_DEPLOY_TOOL" != "sam" ] && [ "$LAMBDA_DEPLOY_TOOL" != "terraform" ]; then
            echo "::error::LAMBDA_DEPLOY_TOOL must be sam or terraform."
            exit 1
          fi

      - name: Set up Python
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up SAM
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: "1.170.0"
          use-installer: true

      - name: Set up Terraform
        if: env.LAMBDA_DEPLOY_TOOL == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy production with SAM
        if: env.LAMBDA_DEPLOY_TOOL == 'sam'
        run: |
          sam build
          sam deploy --config-env production --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Deploy production with Terraform
        if: env.LAMBDA_DEPLOY_TOOL == 'terraform'
        env:
          TF_ENVIRONMENT: ${{ vars.TF_VAR_environment }}
        run: |
          cd "$TF_WORKING_DIR"
          terraform init -input=false
          if [ -n "$TF_ENVIRONMENT" ]; then
            export TF_VAR_environment="$TF_ENVIRONMENT"
          fi
          terraform apply -input=false -auto-approve
