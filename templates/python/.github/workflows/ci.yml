name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  TRIVY_FAIL_SEVERITY: ${{ vars.TRIVY_FAIL_SEVERITY || 'CRITICAL,HIGH' }}
  TRIVY_WARN_SEVERITY: ${{ vars.TRIVY_WARN_SEVERITY || 'MEDIUM' }}
  TRIVY_IGNORE_UNFIXED: ${{ vars.TRIVY_IGNORE_UNFIXED || 'false' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python dependency files
        id: pycache
        run: |
          shopt -s nullglob
          files=()
          for f in requirements.txt requirements-dev.txt requirements-*.txt pyproject.toml; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Add requirements.txt or pyproject.toml so pip installs can be cached."
            exit 1
          fi
          {
            echo "path<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ steps.pycache.outputs.path }}

      - name: Install the project
        run: |
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "Installing the project. pyproject.toml or setup.py must be pip-installable."
            python -m pip install .
          fi

      - name: Lint (ruff check --fix and ruff format fix this)
        id: lint
        run: |
          python -m pip install 'ruff==0.17.3'
          ruff check .
          ruff format --check .

      - name: Security lint (bandit high blocks, medium warns)
        id: security
        run: |
          python -m pip install 'bandit==1.9.4'
          bandit -r . -x ./.venv,./venv,./tests,./build,./dist --severity-level high --confidence-level medium

      - name: Bandit medium (warning)
        if: success()
        run: |
          bandit -r . -x ./.venv,./venv,./tests,./build,./dist --severity-level medium --confidence-level medium -f json -o "$RUNNER_TEMP/bandit.json" --exit-zero
          BANDIT_JSON="$RUNNER_TEMP/bandit.json" python3 - <<'PY'
          import json
          import os
          data = json.load(open(os.environ["BANDIT_JSON"], encoding="utf-8"))
          for item in data.get("results", []):
              if item.get("issue_severity") == "MEDIUM":
                  print(f"::warning::{item.get('test_id')} {item.get('filename')}:{item.get('line_number')} {item.get('issue_text')}")
          PY

      - name: Test
        id: test
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '70' }}
          COVERAGE_SOURCE: ${{ vars.COVERAGE_SOURCE || 'src' }}
        run: |
          if [ ! -d "$COVERAGE_SOURCE" ]; then
            echo "::error::Coverage source '$COVERAGE_SOURCE' does not exist. Add that directory or set the COVERAGE_SOURCE repository variable."
            exit 1
          fi
          python -m pip install 'pytest==9.2.0' 'pytest-cov==7.1.0'
          echo "Tests must cover ${COVERAGE_SOURCE}. Minimum is ${COVERAGE_MIN}%."
          python -m pytest --cov="$COVERAGE_SOURCE" --cov-report=xml --cov-report=term-missing --cov-fail-under="$COVERAGE_MIN"

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          format: json
          output: trivy-fs.json
          exit-code: "0"
          skip-dirs: .git,vendor,.terraform,.venv,node_modules
          ignore-unfixed: ${{ env.TRIVY_IGNORE_UNFIXED }}
          version: v0.70.0

      - name: Enforce Trivy severity
        id: trivy
        env:
          TRIVY_REPORT: trivy-fs.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          fail = {s.strip().upper() for s in os.environ.get("TRIVY_FAIL_SEVERITY", "CRITICAL,HIGH").split(",") if s.strip()}
          warn = {s.strip().upper() for s in os.environ.get("TRIVY_WARN_SEVERITY", "MEDIUM").split(",") if s.strip()}
          path = os.environ.get("TRIVY_REPORT", "trivy.json")
          try:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except FileNotFoundError:
              print(f"::error::Trivy did not write {path}")
              sys.exit(1)
          except json.JSONDecodeError as exc:
              print(f"::error::Trivy report is not JSON: {exc}")
              sys.exit(1)

          if isinstance(report, dict):
              results = report.get("Results") or []
          elif isinstance(report, list):
              results = report
          else:
              results = []

          blocking = []
          warnings = []
          for result in results:
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities") or []:
                  sev = (vuln.get("Severity") or "").upper()
                  line = f"{sev} {vuln.get('VulnerabilityID', '')} {vuln.get('PkgName', '')} ({target})"
                  if sev in fail:
                      blocking.append(line)
                  elif sev in warn:
                      warnings.append(line)
              for secret in result.get("Secrets") or []:
                  title = secret.get("Title") or secret.get("RuleID") or "secret"
                  sev = (secret.get("Severity") or "HIGH").upper()
                  blocking.append(f"secret {sev} {title} ({target})")

          for line in warnings:
              print(f"::warning::{line}")
          for line in blocking:
              print(f"::error::{line}")
          if not blocking and not warnings:
              print("Trivy found nothing at medium or above. A clean scan on a project with no dependency manifest is a pass.")
          if blocking:
              sys.exit(1)
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- secure-ci-templates:ci -->";
            const body = [
              marker,
              "## CI",
              "",
              "| Step | Result |",
              "| --- | --- |",
              `| Lint | ${process.env.LINT_OUTCOME} |`,
              `| Security | ${process.env.SECURITY_OUTCOME} |`,
              `| Test | ${process.env.TEST_OUTCOME} |`,
              `| Trivy | ${process.env.TRIVY_OUTCOME} |`,
              "",
              `[Run](${process.env.RUN_URL})`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => (comment.body || "").includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      language: python
